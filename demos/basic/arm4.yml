#abstract: 4-dof manipulatr
#date: 2025-07-17

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, -0.33], distance: 1.4, yaw: 45, pitch: 20}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: true}]

materials:
    mat1: {normal: [20000, 50], tangent: [20000, 50, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.0}

bodies:
  - name: link1
    joint: {type: rev, parent: root, pos: [0, 0.2, 0], euler: [-90, 0, 0], damping: 0.2}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004], pos: [0, 0, 0.05]}
    shapes: [{type: cylinder, pos: [0, 0, 0], euler: [0, 0, 0], param: [0.03, 0.04], rgba: [0.5, 0.5, 0.5, 1.0]}]

  - name: link2
    joint: {type: rev, parent: link1, pos: [0, 0, 0.1], euler: [0, 90, 0], damping: 0.2}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004], pos: [0, 0.05, 0]}
    shapes: [{type: cylinder, pos: [0, 0, 0], euler: [0, 0, 0], param: [0.03, 0.04], rgba: [0.5, 0.5, 0.5, 1.0]}]
  
  - name: link3
    joint: {type: rev, parent: link2, pos: [0, 0.1, 0], euler: [-90, 0, 0], damping: 0.2}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004], pos: [0, 0, 0.1]}
    shapes: [{type: cylinder, pos: [0, 0, 0.05], euler: [0, 0, 0], param: [0.025, 0.11], rgba: [0.5, 0.5, 0.5, 1.0]}]

  - name: link4
    joint: {type: rev, parent: link3, pos: [0, 0, 0.2], euler: [0, 90, 0], damping: 0.2, q0: 45}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004], pos: [-0.3, 0, 0]}
    shapes:
      - {type: cylinder, pos: [0, 0, 0], euler: [0, 0, 0], param: [0.03, 0.03], rgba: [0.5, 0.5, 0.9, 1.0]}
      - {type: cylinder, pos: [-0.15, 0, 0], euler: [0, 90, 0], param: [0.015, 0.11], rgba: [0.5, 0.5, 0.9, 1.0]}

  - name: ball
    joint: {type: fixed, parent: link4, pos: [-0.3, 0, 0]}
    inertial: {mass: 1.0, tensor: [sphere, 0.03]}
    shapes: [{type: sphere, param: [0.03], contact: [0, mat1], rgba: [0.8, 0.4, 0.4, 1.0]}]

feeds:
  - jointpos: [link1, link2, link3, link4]
  - jointvel: [link1, link2, link3, link4]
  - ftsensor: [ball]