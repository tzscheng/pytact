#floating two-link manipulator
#(flying-V)

sim: {solver: lcp, dt: 0.001, g: [0, 0, 0]}
view: {target: [1.0, 0, 0], distance: 2.5, yaw: -90, pitch: 30}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: true}]

bodies:
  - name: link1
    joint: {type: free, q0: [0, 0, 0, 0, 0, 0]}
    inertial: {mass: 1.0, tensor: [diag, 0.01, 0.0833, 0.0833], pos: [0.5, 0, 0]}
    shapes: [{type: capsule, pos: [0.5, 0, 0], euler: [0, 90, 0],  param: [0.02, 0.5], rgba: [0.4, 0.4, 0.4, 1.0]}]

  - name: link2
    joint: {type: rev, parent: link1, pos: [1.0, 0, 0], q0: 45}
    inertial: {mass: 1.0, tensor: [diag, 0.01, 0.0833, 0.0833], pos: [0.5, 0, 0]}
    shapes: [{type: capsule, pos: [0.5, 0, 0], euler: [0, 90, 0],  param: [0.02, 0.5], rgba: [0.4, 0.4, 0.4, 1.0]}]

feeds:
  - jointpos: [link2]
  - jointvel: [link2]
