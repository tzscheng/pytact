#abstract: a concave floating object
#date: 2025-07-17

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, 0], distance: 3, yaw: 105, pitch: 20}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: true}]

materials:
    mat1: {normal: [30000, 10], tangent: [20000, 10, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.0}
    mat2: {normal: [10000,  2], tangent: [20000,  2, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.0}

bodies:
  - name: root
    shapes:
      - {type: box, euler: [-20, 20, 0], param: [0.5, 0.5, 0.1], contact: [1, mat1], rgba: [0.9, 0.9, 0.9, 1.0]}
      - {type: box, pos: [0.6, 0, 0], param: [0.1, 0.5, 0.3], contact: [1, mat1], rgba: [0.9, 0.9, 0.9, 1.0]}

  - name: object
    joint: {type: free, q0: [-0.1, -0.1, 0.6, 0, 0, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.05]}
    shapes:
      - {type: mesh, pos: [0, 0, -0.1], file: objs/5.obj, contact: [1, mat1], rgba: [0.3, 0.8, 0.3, 1.0]}
      - {type: mesh, file: objs/big_disk.obj, contact: [1, mat2], rgba: [0.3, 0.3, 0.8, 1.0]}
      #- {type: box, param: [0.15, 0.15, 0.05], contact: [1, 20000, 10, 10], rgba: [0.4, 0.4, 0.9, 1.0]}
      #- {type: box, param: [0.05, 0.05, 0.15], contact: [1, 20000, 10, 10], rgba: [0.4, 0.4, 0.9, 1.0]}