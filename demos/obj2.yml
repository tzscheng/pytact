#abstract: various floating object
#date: 2025-07-17

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, 0], distance: 3, yaw: 30, pitch: 30}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: true}]

materials:
    mat1: {normal: [20000, 100], tangent: [10000, 100, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.5}
    mat2: {normal: [20000, 50], tangent: [10000, 50, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.5}

bodies:
  - name: root
    shapes: [{type: box, pos: [0, 0, -0.05], param: [1.0, 1.0, 0.05], contact: [1, mat1], rgba: [0.8, 0.8, 0.8, 1.0]}]

  - name: obj1
    joint: {type: free, q0: [0, 0, 0.2, 0, 10, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.1]}
    shapes: [{type: box, param: [0.1, 0.1, 0.1], contact: [1, mat2], rgba: [0.4, 0.4, 0.9, 1.0]}]

  - name: obj2
    joint: {type: free, q0: [0, 0, 0.8, 0, 0, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.1]}
    shapes: [{type: sphere, param: [0.1], contact: [1, mat1], rgba: [0.9, 0.4, 0.4, 1.0]}]

  - name: obj3
    joint: {type: free, q0: [0.3, 0, 0.7, 35, 0, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.1]}
    shapes: [{type: cylinder, param: [0.1, 0.1], contact: [1, mat1], rgba: [0.9, 0.9, 0.4, 1.0]}]

  - name: obj4
    joint: {type: free, q0: [-0.5, 0, 0.6, 45, 0, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.1]}
    shapes: [{type: capsule, param: [0.1, 0.1], contact: [1, mat1], rgba: [0.9, 0.4, 0.9, 1.0]}]

  - name: obj5
    joint: {type: free, q0: [0, 0.5, 0.6, 45, 0, 0]}
    inertial: {mass: 1, tensor: [sphere, 0.1]}
    shapes: [{type: mesh, file: meshes/pyramid.obj, contact: [1, mat1], rgba: [0.4, 0.9, 0.9, 1.0]}]

