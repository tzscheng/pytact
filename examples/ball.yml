# A single free-flying ball, added to a scene at runtime (env.add) and given an
# initial velocity. Used by examples/ball_throw.py (spacebar → launch at the wall).
materials:
    ball: {normal: [30000, 100], tangent: [20000, 100, 0.9], spin: [200, 2, 0.05], roll: [200, 2, 0.02], restitution: 0.0}

bodies:
  - name: ball
    joint: {type: free, q0: [0, 0.7, 0.3, 0, 0, 0]}
    inertial: {mass: 1.0, tensor: [sphere, 0.07]}
    shapes:
      - {type: sphere, param: [0.07], contact: [1, ball], rgba: [0.15, 0.45, 0.95, 1.0]}
