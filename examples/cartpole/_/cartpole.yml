#abstract: cart-pole example
#date: 2025-07-17

solver: rk4
dt: 0.005
g: [0, -9.81, 0]
view: [0, 90, -90, -2, 2, -2, 2, -2, 2, 0]

bodies:
  - name: cart
    joint: {type: lin, parent: root, euler: [0, 90, 0], damping: 0.1}
    inertial: {mass: 1.0, tensor: [diag, 0.01, 0.0833, 0.0833]}
    visual:
      - [line, 0, 0, -0.5, 0, 0, 0.5]

  - name: pole
    joint: {type: rev, parent: cart, euler: [0, 90, 0], damping: 0.1, q0: 180}
    inertial: {mass: 1.0, tensor: [diag, 0.01, 0.0833, 0.0833], pos: [0, 0.5, 0]}
    visual:
      - [line, 0, 0, 0, 0, 1, 0]
      - [o, 0, 1, 0]

feeds:
  - jointpos: [cart, pole]
  - jointvel: [cart, pole]