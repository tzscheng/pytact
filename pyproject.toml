[build-system]
requires = ["setuptools>=70.1", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytact"
version = "0.1.0a5"
description = "Python package for tact, a high contact/tactile fidelity dynamics simulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ipc = ["pyzmq>=25"]
demos = ["pyzmq>=25"]

[project.urls]
Repository = "https://github.com/tzscheng/pytact"
Issues = "https://github.com/tzscheng/pytact/issues"

[tool.setuptools]
packages = [
    "tact",
    "tact.bin",
]

[tool.setuptools.package-data]
tact = [
    "bin/libtact.so",
]

[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
archs = ["x86_64"]
skip = "*musllinux*"
manylinux-x86_64-image = "manylinux_2_28"
before-all = "yum install -y glfw-devel turbojpeg-devel libzstd-devel"
test-command = "python -c \"import os, tact; assert os.path.exists(os.path.join(tact.pkg_dir, 'bin', 'libtact.so'))\""
