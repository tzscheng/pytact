[build-system]
requires = ["setuptools>=70.1", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytact"
version = "0.1.0"
description = "Python package for tact, a high contact/tactile fidelity dynamics simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
control = [
    "scipy>=1.11",
    "osqp>=1.0",
]
ipc = [
    "pyzmq>=25",
]

[project.urls]
Repository = "https://github.com/tzscheng/fg"
Issues = "https://github.com/tzscheng/fg/issues"

[tool.setuptools]
packages = ["tact", "tact.bin", "tact.demos", "tact.demos.meshes", "tact.envs"]

[tool.setuptools.package-data]
tact = [
    "bin/libtact.so",
    "envs/*.yml",
    "envs/*.bin",
    "envs/*.py",
    "demos/*.yml",
    "demos/*.bin",
    "demos/*.py",
    "demos/meshes/*.obj",
]
