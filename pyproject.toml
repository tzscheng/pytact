[build-system]
requires = ["setuptools>=70.1", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytact"
version = "0.1.0a1"
description = "Python package for tact, a high contact/tactile fidelity dynamics simulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ipc = ["pyzmq>=25"]
demos = ["pyzmq>=25"]

[project.urls]
Repository = "https://github.com/tzscheng/pytact"
Issues = "https://github.com/tzscheng/pytact/issues"

[tool.setuptools]
packages = [
    "tact",
    "tact.bin",
    "tact.demos",
    "tact.demos.basic",
    "tact.demos.basic.meshes",
    "tact.demos.cartpole",
    "tact.demos.cartpole._",
    "tact.demos.raymap",
    "tact.demos.tactile",
    "tact.demos.topology",
]

[tool.setuptools.package-data]
tact = [
    "bin/libtact.so",
    "demos/*.yml",
    "demos/*.py",
    "demos/**/*.yml",
    "demos/**/*.py",
    "demos/**/*.obj",
    "demos/**/*.stl",
]
