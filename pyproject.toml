[build-system]
requires = ["setuptools>=70.1", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytact"
version = "0.1.0"
description = "Python package for tact, a high contact/tactile fidelity dynamics simulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pyzmq>=25",
]

[project.urls]
Repository = "https://github.com/tzscheng/fg"
Issues = "https://github.com/tzscheng/fg/issues"

[tool.setuptools]
packages = [
    "tact",
    "tact.bin",
    "tact.demos",
    "tact.demos.basic",
    "tact.demos.basic.meshes",
    "tact.demos.cartpole",
    "tact.demos.cartpole._",
    "tact.demos.raymap",
    "tact.demos.topology",
]

[tool.setuptools.package-data]
tact = [
    "bin/libtact.so",
    "demos/*.yml",
    "demos/*.py",
    "demos/**/*.yml",
    "demos/**/*.py",
    "demos/**/*.obj",
]
