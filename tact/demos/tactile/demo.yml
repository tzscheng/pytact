#abstract: 2-DoF pitch/roll tactile pad with a 20x20 taxel array and a sphere resting on top.

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81], iters: 40}
view: {target: [0, 0, 0.11], distance: 0.3, yaw: 135, pitch: 35}
lights: [{pos: [0.5, 0.5, 1.0], target: [0, 0, 0.1], ortho: 0.5, shadow: true}]

materials:
  pad_mat: {normal: [30000, 300], tangent: [20000, 200, 0.8], spin: [100, 1, 0.002], roll: [100, 1, 0.00005], restitution: 0.0}
  ball_mat: {normal: [30000, 300], tangent: [20000, 200, 0.8], spin: [100, 1, 0.002], roll: [100, 1, 0.00005], restitution: 0.0}

tactiles:
  - name: top_taxels
    body: pad
    fps: 1000
    cell: [0.005, 0.005]
    radius: 0.004
    kernel: gaussian
    channels: [normal, shear_u, shear_v, pressure]
    samples_file: taxels.csv

bodies:
  - name: root

  - name: pitch_link
    joint: {type: rev, parent: root, pos: [0, 0, 0.1], euler: [-90, 0, 0], damping: 0.05, q0: 0}
    inertial: {mass: 0.001, tensor: [sphere, 0.001]}

  - name: roll_link
    joint: {type: rev, parent: pitch_link, pos: [0, 0, 0], euler: [0, 90, 0], damping: 0.05, q0: 0}
    inertial: {mass: 0.001, tensor: [sphere, 0.001]}

  - name: pad
    joint: {type: fixed, parent: roll_link, pos: [0, 0, 0], euler: [90, 0, 90]}
    inertial: {mass: 0.1, tensor: [box, 0.1, 0.1, 0.02]}
    shapes:
      - {type: box, pos: [0, 0, 0], param: [0.05, 0.05, 0.01], contact: [1, pad_mat], rgba: [0.55, 0.58, 0.62, 1.0]}
      - {type: box, pos: [0, 0.052, 0.010], param: [0.056, 0.004, 0.020], contact: [1, pad_mat], rgba: [0.45, 0.50, 0.56, 0.35]}
      - {type: box, pos: [0, -0.052, 0.010], param: [0.056, 0.004, 0.020], contact: [1, pad_mat], rgba: [0.45, 0.50, 0.56, 0.35]}
      - {type: box, pos: [0.052, 0, 0.010], param: [0.004, 0.048, 0.020], contact: [1, pad_mat], rgba: [0.45, 0.50, 0.56, 0.35]}
      - {type: box, pos: [-0.052, 0, 0.010], param: [0.004, 0.048, 0.020], contact: [1, pad_mat], rgba: [0.45, 0.50, 0.56, 0.35]}

  - name: ball
    joint: {type: free, parent: root, q0: [0, 0, 0.129, 0, 0, 0]}
    inertial: {mass: 0.1, tensor: [sphere, 0.020]}
    shapes:
      - {type: sphere, param: [0.020], contact: [1, ball_mat], rgba: [0.15, 0.45, 0.95, 1.0]}
