#abstract: 3-dof manipulatr with f/t sensor in upper arm
#date: 2025-07-17

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, -0.5], distance: 2.5, yaw: 90, pitch: 0}
lights: [{pos: [7, 7, 7], target: [0, 0, 0], ortho: 5.0, shadow: true}]

materials:
    mat1: {normal: [20000, 50], tangent: [20000, 50, 0.8], spin: [100, 1, 0.02], roll: [100, 1, 0.005], restitution: 0.0}

bodies:
  - name: link1
    joint: {type: rev, parent: root, euler: [0, 90, 0], damping: 0.1}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004]}

  - name: link2-1
    joint: {type: rev, parent: link1, euler: [-90, 0, 0], damping: 0.1}
    inertial: {mass: 0.5, tensor: [diag, 0.004, 0.004, 0.004], pos: [0.125, 0, 0]}
    shapes: [{type: capsule, pos: [0.125, 0, 0], euler: [0, 90, 0],  param: [0.02, 0.125], rgba: [0.2, 0.2, 0.7, 1.0]}]

  - name: link2-2
    joint: {type: fixed, parent: link2-1, pos: [0.25, 0, 0]}
    inertial: {mass: 0.5, tensor: [diag, 0.004, 0.004, 0.004], pos: [0.125, 0, 0]}
    shapes: [{type: capsule, pos: [0.125, 0, 0], euler: [0, 90, 0],  param: [0.02, 0.125], rgba: [0.7, 0.2, 0.2, 1.0]}]

  - name: link3
    joint: {type: rev, parent: link2-2, pos: [0.25, 0, 0], damping: 0.1, q0: 90}
    inertial: {mass: 1.0, tensor: [diag, 0.004, 0.004, 0.004], pos: [0.25, 0, 0]}
    shapes:
      - {type: capsule, pos: [0.25, 0, 0], euler: [0, 90, 0], param: [0.02, 0.25], rgba: [0.4, 0.4, 0.4, 1.0]}
      - {type: sphere, pos: [0.5, 0, 0], param: [0.05], contact: [0, mat1], rgba: [0.9, 0.4, 0.4, 1.0]}

feeds:
  - jointpos: [link1, link2-1, link3]
  - jointvel: [link1, link2-1, link3]
  - ftsensor: [link2-2]