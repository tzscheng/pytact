#abstract: 10x10 m walkable height-field terrain for legged robots (Tier-1 hfield)
#date: 2026-05-27
# Height grid: hf1.bin (101x101, meters, MuJoCo custom hfield binary), in this
# same dir. Vendored test fixture for test_height_scan.py / test_bin_smoke.py.
# Note: contact (sphere feet) and height_scan foot-placement are fast (footprint-local);
# full-frame depth/lidar sensors over this grid are slow in Tier 1 (brute-force raycast).

sim: {solver: lcp, dt: 0.001, g: [0, 0, -9.81]}
view: {target: [0, 0, 0], distance: 12, yaw: 90, pitch: 25}
lights: [{pos: [6, 6, 10], target: [0, 0, 0], ortho: 8.0, shadow: true}]

materials:
    ground: {normal: [50000, 200], tangent: [50000, 200, 1.0], spin: [200, 2, 0.05], roll: [200, 2, 0.02], restitution: 0.0}

bodies:
  - name: root
    shapes:
      - {type: hfield, file: hf1.bin, size: [5, 5, 1], pos: [0, 0, 0], contact: [1, ground], rgba: [0.45, 0.5, 0.35, 1.0]}
